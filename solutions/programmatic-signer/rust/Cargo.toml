[package]
name = "programmatic-signer-nonce-replacement-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "mollusk-svm tests proving Ed25519 Programmatic Signer satisfies the nonce-account-replacement spec"

[dev-dependencies]
spl-ed25519-signer-client = { git = "https://github.com/solana-program/ed25519-programmatic-signer", rev = "e3c948d" }
spl-ed25519-signer-interface = { git = "https://github.com/solana-program/ed25519-programmatic-signer", rev = "e3c948d" }
spl-message-executor-client = { git = "https://github.com/solana-program/ed25519-programmatic-signer", rev = "e3c948d" }
spl-message-executor-interface = { git = "https://github.com/solana-program/ed25519-programmatic-signer", rev = "e3c948d" }
spl-nonce-interface = { git = "https://github.com/solana-program/ed25519-programmatic-signer", rev = "e3c948d" }
mollusk-svm = "0.15.0"
mollusk-svm-programs-token = "0.15.0"
solana-account = "4.3.0"
solana-address = "2.6.1"
solana-hash = "4.4.0"
solana-instruction = "3.4.1"
solana-keypair = "3.1.2"
solana-message = "4.4.1"
solana-program-error = "3.0.1"
solana-program-option = "3.1"
solana-program-pack = "3.1.0"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2.0", features = ["wincode"] }
spl-token-interface = "2.0"
wincode = "0.5.5"
